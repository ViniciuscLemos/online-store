# Render config (Blueprint): one service that builds React and starts the API,
# which serves both. Without Stripe keys or SMTP the store runs as a demo: demo checkout and the in-app inbox.
services:
  - type: web
    name: online-store
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SEED_SAMPLE_PRODUCTS
        value: "true"
      # PGlite doesn't fit in the free instance's 512 MB, so the deploy uses a real Postgres:
      # a free Neon one (Render's free database is deleted after 30 days). The connection is
      # borrowed from the link shortener on the same Neon project, with its own database.
      - key: DATABASE_URL
        fromService:
          type: web
          name: trail
          envVarKey: DATABASE_URL
      - key: DATABASE_NAME
        value: online_store
      # optional, each one turns a demo part into the real thing
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_URL
        sync: false
